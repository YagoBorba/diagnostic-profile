name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install development tools
        run: npm ci

      - name: Run tests
        run: |
          npm run check
          npm test

      - name: Render example from fixture
        run: node src/cli.mjs --config examples/diagnostic-profile.json --fixture test/fixtures/user.json --output dist

      - name: Build Studio and check its module syntax
        run: |
          node --check studio/app.mjs
          npm run build:studio

      - name: Check preview assets are up to date
        run: |
          npm run preview
          git diff --exit-code -- docs/preview

      - name: Build visual review sheet
        run: npm run proof

      - name: Upload visual review sheet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-proof-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/proof
          retention-days: 3
