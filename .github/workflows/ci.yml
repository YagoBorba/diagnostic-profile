name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install development tools
        run: npm ci

      - name: Run tests
        run: |
          npm run check
          npm test

      - name: Render example from fixture
        run: node src/cli.mjs --config examples/diagnostic-profile.json --fixture test/fixtures/user.json --output dist

      - name: Build Studio and check its module syntax
        run: |
          node --check studio/app.mjs
          npm run build:studio

      - name: Check preview assets are up to date
        run: |
          npm run preview
          git diff --exit-code -- docs/preview

      - name: Verify Pages artifact packaging without deployment
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: studio-validation
          path: dist/site
          retention-days: 1

      - name: Build visual review sheet
        run: npm run proof

      - name: Upload visual review sheet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-proof-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/proof
          retention-days: 3
