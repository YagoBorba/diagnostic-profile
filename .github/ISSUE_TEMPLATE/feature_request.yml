name: Feature or integration request
description: Suggest an improvement with a concrete use case
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed result and acceptance criteria
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Related roadmap IDs
  - type: textarea
    id: maintenance
    attributes:
      label: External services and maintenance
      description: Mention authentication, quotas and fallback behavior for integrations.
