<title id="title">FleetLink — Gateway · Telemetry</title>
<desc id="desc">Fleet telemetry gateway that streams vehicle data over MQTT into a time-series store, with backpressure, replay and per-device quotas. Built with Go, MQTT, TimescaleDB, gRPC. Status: recent.</desc>
