<title id="title">BorbaCarLabs — Java</title>
<desc id="desc">An Android OBD-II car diagnostic app built in Java. Connects to ELM327 adapters over Bluetooth, BLE or Wi-Fi to read trouble codes and live sensor data, keeps a maintenance journal with official Inmetro fuel economy, and generates traceable PDF reports with optional AI analysis. Built with android, automotive, bluetooth-low-energy, car-diagnostics. Status: recent.</desc>
